# Epic TDD Pipeline
#
# Autonomous implementation of beads epic tasks using TDD + RO5 review.
# Picks the next ready task from a beads epic, implements it with
# test-driven discipline, reviews via Rule of 5, commits, closes the
# issue, then signals readiness for the next task.
#
# Designed for: working through a beads epic's dependency-ordered tasks
# without manual intervention between tasks.
#
# Usage: wai pipeline start epic-tdd --topic="<epic-id>: <epic description>"
#
# The autonomous loop between tasks:
#   1. Pipeline completes "ship" step → closes beads issue
#   2. /clear → fresh context
#   3. wai pipeline start epic-tdd --topic="<same epic>"
#   4. "pick" step runs bd ready, claims the next unblocked task

[pipeline]
name = "epic-tdd"
description = "Autonomous epic execution: pick task → TDD → RO5 review → ship → next"

[pipeline.metadata]
when = "Working through a beads epic with multiple dependency-ordered tasks"
skills = ["tdd", "rule-of-5-universal"]

[[steps]]
id = "pick"
prompt = """
{topic}: Pick the next task to implement.

Run `bd ready` to find tasks ready to work. Select the highest-priority
task that belongs to this epic (check with `bd show <id>` — look for the
epic in BLOCKS/DEPENDS ON chains).

Then:
1. `bd show <id>` — read the full description, acceptance criteria, notes
2. `bd update <id> --claim` — claim the task
3. Read the relevant openspec tasks.md for context on what this task requires
4. Read the source files that will be affected
5. Summarize: what needs to change, which files, what tests exist

If NO tasks from this epic are ready:
- Check `bd blocked` to see what's holding them up
- Report to the user and stop

Record what you picked: `wai add plan "claimed <id>: <title>"`
Advance: `wai pipeline next`
"""

[steps.gate.structural]
min_artifacts = 1
types = ["plan"]

[[steps]]
id = "plan"
prompt = """
{topic}: Plan the implementation for the claimed task.

Based on the task description and current code state:
1. Define what behavior is being added or changed
2. List the test cases needed (name each, describe expected behavior)
3. Identify existing tests that might need updating
4. Map out which files need changes and what changes
5. Note any risks or edge cases from the spec

Keep the plan proportional to the task size:
- Simple config/wiring tasks: 3-5 test cases, 1-2 files
- New module tasks: 5-10 test cases, 2-4 files
- Refactor tasks: focus on parity tests proving no behavior change

Do NOT write code or tests yet — only the plan.

Record plan: `wai add plan "implementation plan for <id>"`
Advance: `wai pipeline next`
"""

[steps.gate.structural]
min_artifacts = 1
types = ["plan"]

[[steps]]
id = "red"
prompt = """
{topic}: Write failing tests for the claimed task.

Implement the test cases from your plan. Every test should FAIL because
the production code doesn't exist yet (or doesn't have the new behavior).

For each test:
1. Write the test with clear assertions
2. Run the test suite — confirm the new test fails
3. Confirm existing tests still pass (no collateral damage)

For verification/wiring tasks where behavior already exists:
- Write the test first, confirm it passes (proving the wiring works)
- If it fails, that's your bug — proceed to green to fix it

Do NOT write any production code. The only changes should be test files.

Record: `wai add plan "tests written — N new, M updated"`
Advance: `wai pipeline next`
"""

[steps.gate.structural]
min_artifacts = 1

[[steps]]
id = "green"
prompt = """
{topic}: Make the tests pass with minimal code.

Write the simplest production code that makes ALL tests pass.
Do not optimize, do not refactor, do not add anything beyond what
the tests require.

Rules:
- If a test passes without any code change, the test is wrong — fix it
- If you need to change a test to make it pass, go back to red
- Run the FULL test suite after every change
- For TypeScript: also run `npx tsc --noEmit` to verify types

Advance only when all tests are green AND types check.
Advance: `wai pipeline next`
"""

[[steps.gate.oracles]]
name = "tests-pass"
description = "All tests must pass before advancing"
timeout = 300

[[steps]]
id = "refactor"
prompt = """
{topic}: Clean up while keeping tests green.

Improve the code without changing behavior:
- Extract duplication (but only if ≥3 occurrences)
- Improve naming
- Simplify control flow
- Remove dead code introduced during green step

After EVERY change, run the full test suite. If any test breaks,
undo the change immediately.

For small tasks with clean green code: skip is acceptable.
Record: `wai add plan "refactor complete"` (or "refactor skipped — green code is clean")
Advance: `wai pipeline next`
"""

[[steps.gate.oracles]]
name = "tests-pass"
description = "All tests must still pass after refactoring"
timeout = 300

[[steps]]
id = "review"
prompt = """
{topic}: Run Rule of 5 review on all changes in this task.

Execute /rule-of-5-universal on the code written in this cycle:
1. **Accuracy** — correctness of logic, edge cases
2. **Completeness** — missing tests, unhandled paths
3. **Clarity** — naming, structure, readability
4. **Actionability** — each finding has a concrete fix
5. **Integration** — consistency with the rest of the codebase

Focus the review on changes since the task was claimed.
Record the findings — do NOT fix anything yet.

Record review: `wai add review "RO5 findings for <id>"`
Advance: `wai pipeline next`
"""

[steps.gate.procedural]
require_review = true
max_critical = 0

[[steps]]
id = "fix"
prompt = """
{topic}: Address ALL findings from the review.

Go through every finding and fix it:
- Critical and high: must be fixed
- Medium: fix unless there's a documented reason to defer
- Low: fix if quick, defer with a note otherwise

For each fix:
1. Make the change
2. Run the test suite — confirm all tests still pass
3. If a fix requires a new test, add it

If the review found 0 issues, record that and advance.

Record: `wai add research "review findings addressed for <id>"`
Advance: `wai pipeline next`
"""

[steps.gate.structural]
min_artifacts = 1

[[steps.gate.oracles]]
name = "tests-pass"
description = "All tests must pass after fixes"
timeout = 300

[[steps]]
id = "ship"
prompt = """
{topic}: Commit, close the beads issue, and prepare for next task.

Checklist:
- [ ] All tests pass (`npx vitest run`)
- [ ] Types check (`npx tsc --noEmit`)
- [ ] All review findings addressed or deferred with reason
- [ ] Changes committed with descriptive message
- [ ] Beads issue closed: `bd close <id>`
- [ ] Check if closing unblocked new tasks: `bd close <id> --suggest-next`
- [ ] Push to remote: `git push`

After closing, report:
- What was completed
- What tasks are now unblocked
- Whether more tasks from this epic are ready

Record: `wai add research "shipped <id>: <summary>"`

If more tasks are ready, tell the user:
"Task <id> complete. Next ready: <list>. Run `wai pipeline start epic-tdd --topic=...` after /clear to continue."

Pipeline complete.
"""

[steps.gate.structural]
min_artifacts = 1
