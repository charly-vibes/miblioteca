<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miblioteca · Ghost Overlay Debug Replay</title>
  <style>
    :root {
      --bg: #0d1117; --bg2: #161b22; --bg3: #21262d;
      --border: #30363d; --text: #e6edf3; --muted: #7d8590;
      --orange: #f0883e; --blue: #58a6ff; --green: #3fb950; --red: #f85149;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    code { font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: 0.85em; }

    /* ── header ──────────────────────────────────── */
    .hdr { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
    .hdr h1 { font-size: 16px; font-weight: 600; }
    .hdr-sub { font-size: 12px; color: var(--muted); margin-left: auto; }

    /* ── drop zone ───────────────────────────────── */
    #drop-zone {
      margin: 32px auto; max-width: 480px;
      border: 2px dashed var(--border); border-radius: 10px;
      padding: 48px 32px; text-align: center; cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    #drop-zone:hover { border-color: var(--blue); }
    #drop-zone.drag-over { border-color: var(--green); background: rgba(63,185,80,.05); }
    #drop-zone .icon { font-size: 36px; margin-bottom: 12px; }
    #drop-zone p { color: var(--muted); font-size: 13px; margin-top: 6px; }
    #file-input { display: none; }

    /* ── meta bar ────────────────────────────────── */
    .meta-bar { display: flex; flex-wrap: wrap; gap: 20px; padding: 10px 20px; background: var(--bg2); border-bottom: 1px solid var(--border); font-size: 12px; }
    .meta-item b { color: var(--text); }
    .meta-item { color: var(--muted); }

    /* ── content ─────────────────────────────────── */
    .content { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }

    /* ── panel ───────────────────────────────────── */
    .panel { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .panel-hdr {
      padding: 10px 14px; background: var(--bg3); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .panel-hdr h2 { font-size: 13px; font-weight: 600; }
    .panel-body { padding: 12px 14px; }
    .chart-label { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 6px; }

    /* ── stat pills ───────────────────────────────── */
    .pill { font-size: 11px; padding: 2px 7px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border); color: var(--text); }
    .pill.green { border-color: var(--green); color: var(--green); }
    .pill.orange { border-color: var(--orange); color: var(--orange); }
    .pill.red { border-color: var(--red); color: var(--red); }
    .issue { font-size: 11px; padding: 2px 7px; border-radius: 4px; background: rgba(248,81,73,.12); color: var(--red); border: 1px solid rgba(248,81,73,.3); }

    /* ── charts ───────────────────────────────────── */
    .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
    .chart-col { padding: 12px 14px; border-right: 1px solid var(--border); }
    .chart-col:last-child { border-right: none; }
    canvas { width: 100%; display: block; border-radius: 3px; }

    /* ── legend ───────────────────────────────────── */
    .legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; font-size: 11px; color: var(--muted); }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

    /* ── no-data ──────────────────────────────────── */
    .no-data { padding: 14px; color: var(--muted); font-size: 13px; }

    /* ── resim controls ──────────────────────────── */
    .resim-controls { display: flex; flex-wrap: wrap; gap: 16px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .resim-group { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 140px; }
    .resim-group label { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
    .resim-group .val { font-size: 12px; font-weight: 600; color: var(--text); font-family: monospace; }
    .resim-group input[type=range] { width: 100%; accent-color: var(--blue); }
    .resim-summary { padding: 10px 14px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 16px; }
    .resim-summary .metric { display: flex; flex-direction: column; gap: 2px; }
    .resim-summary .metric b { color: var(--text); font-size: 14px; font-family: monospace; }
    .resim-summary .metric.bad b { color: var(--red); }
    .resim-summary .metric.good b { color: var(--green); }

    @media (max-width: 600px) {
      .charts-grid { grid-template-columns: 1fr; }
      .chart-col { border-right: none; border-bottom: 1px solid var(--border); }
      .chart-col:last-child { border-bottom: none; }
    }
  </style>
</head>
<body>

<div class="hdr">
  <h1>Miblioteca · Ghost Overlay Debug Replay</h1>
  <span class="hdr-sub">Drop a <code>miblioteca-debug-*.json</code> file to analyse a session</span>
</div>

<div id="drop-zone">
  <div class="icon">📂</div>
  <strong>Drop debug JSON here</strong>
  <p>or click to browse</p>
  <input type="file" id="file-input" accept=".json">
</div>

<div id="session" style="display:none">
  <div class="meta-bar" id="meta-bar"></div>
  <div class="content" id="content"></div>
</div>

<script>
// ─── Constants matching the app ──────────────────────────────────────────────
const HFOV_DEG = 65;
const MOTION_GATE_SHOW = 0.40; // rad/s — ghost appears below this
const MOTION_GATE_HIDE = 0.55; // rad/s — ghost hides above this (hysteresis)

// ─── File handling ────────────────────────────────────────────────────────────
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');

dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => { if (fileInput.files[0]) load(fileInput.files[0]); });
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('drag-over'); if (e.dataTransfer.files[0]) load(e.dataTransfer.files[0]); });

function load(file) {
  const r = new FileReader();
  r.onload = e => {
    try { render(JSON.parse(e.target.result)); }
    catch (err) { alert('Could not parse JSON: ' + err.message); }
  };
  r.readAsText(file);
}

// ─── Main render ──────────────────────────────────────────────────────────────
function render(data) {
  const { meta, events } = data;

  const byType = {};
  for (const ev of events) (byType[ev.type] ??= []).push(ev);

  const captures    = byType['capture:shutter'] ?? [];
  const sensorAll   = byType['sensor:orientation-sample'] ?? [];
  const shiftAll    = byType['ghost:shift'] ?? [];
  const visAll      = byType['ghost:visibility-changed'] ?? [];

  const duration = meta.sessionMs;

  dropZone.style.display = 'none';
  document.getElementById('session').style.display = 'block';

  // Meta bar
  const ua = meta.userAgent.match(/\(([^)]+)\)/)?.[1] ?? '?';
  document.getElementById('meta-bar').innerHTML = [
    `<div class="meta-item"><b>${(duration/1000).toFixed(1)}s</b> session</div>`,
    `<div class="meta-item"><b>${captures.length}</b> captures</div>`,
    `<div class="meta-item"><b>${sensorAll.length}</b> sensor samples</div>`,
    `<div class="meta-item"><b>${shiftAll.length}</b> ghost:shift events</div>`,
    `<div class="meta-item"><b>${visAll.filter(e=>!e.payload.visible).length}</b> motion-gate triggers</div>`,
    `<div class="meta-item">${ua}</div>`,
    `<div class="meta-item">${new Date(meta.exportedAt).toLocaleString()}</div>`,
  ].join('');

  // Build sections: one per inter-capture gap
  const times = [0, ...captures.map(c => c.t), duration];
  const sections = times.slice(1).map((endT, i) => {
    const startT = times[i];
    const slice = arr => arr.filter(e => e.t > startT && e.t <= endT);
    // captureAtEnd = the capture event that bounds the END of this section (null for last section)
    const captureAtEnd = i < captures.length ? captures[i] : null;
    return { i, startT, endT, sensor: slice(sensorAll), shift: slice(shiftAll), vis: slice(visAll), captureAtEnd };
  });

  const content = document.getElementById('content');
  content.innerHTML = '';

  // Master timeline
  content.appendChild(masterTimeline(events, captures, visAll, duration));

  // Re-simulation panel (betaDeg + translation with adjustable thresholds)
  const motionAll = byType['ghost:motion-sample'] ?? [];
  if (motionAll.length > 0) {
    content.appendChild(resimPanel(motionAll, shiftAll, visAll, captures, duration));
  }

  // Section cards
  for (const s of sections) content.appendChild(sectionCard(s, captures, duration));

  // Draw after layout
  requestAnimationFrame(() => requestAnimationFrame(() => drawAll()));
}

// ─── Deferred drawing registry ────────────────────────────────────────────────
const drawQueue = [];
function queueDraw(fn) { drawQueue.push(fn); }
function drawAll() { for (const fn of drawQueue) fn(); drawQueue.length = 0; }

// ─── Master timeline ──────────────────────────────────────────────────────────
function masterTimeline(events, captures, visAll, duration) {
  const panel = makePanel('Session Overview', []);
  const body = panel.querySelector('.panel-body');

  body.innerHTML = `<div class="chart-label">Event timeline · captures (orange) · ghost visibility (blue=visible, red=hidden) · |ω| sparkline (gray) · gate show/hide (${MOTION_GATE_SHOW}/${MOTION_GATE_HIDE} rad/s, dashed)</div>`;
  const cv = makeCanvas(72);
  body.appendChild(cv);

  const legend = document.createElement('div');
  legend.className = 'legend';
  legend.innerHTML = [
    legend_('Capture', '#f0883e'),
    legend_('Ghost visible', 'rgba(88,166,255,.4)'),
    legend_('Ghost hidden (fast motion)', 'rgba(248,81,73,.3)'),
    legend_('|ω|', '#7d8590'),
  ].join('');
  body.appendChild(legend);

  const sensorAll = events.filter(e => e.type === 'sensor:orientation-sample');

  queueDraw(() => {
    const W = cv.parentElement.clientWidth - 28;
    cv.width = W; cv.height = 72;
    const ctx = cv.getContext('2d');
    const tX = t => (t / duration) * W;

    ctx.fillStyle = '#0d1117'; ctx.fillRect(0, 0, W, 72);

    // Visibility bands
    let wasVis = false, lastT = 0;
    for (const ev of visAll) {
      paintBand(ctx, tX(lastT), tX(ev.t), wasVis ? 'rgba(88,166,255,.15)' : (lastT > 0 ? 'rgba(248,81,73,.15)' : null));
      wasVis = ev.payload.visible; lastT = ev.t;
    }
    paintBand(ctx, tX(lastT), W, wasVis ? 'rgba(88,166,255,.15)' : 'rgba(248,81,73,.1)');

    // |ω| sparkline
    const maxOmega = 1.5;
    ctx.strokeStyle = 'rgba(125,133,144,.6)'; ctx.lineWidth = 1;
    polyline(ctx, sensorAll, e => tX(e.t), e => 68 - Math.min(e.payload.omegaMag / maxOmega, 1) * 58);

    // Gate lines (show = faint, hide = solid)
    ctx.setLineDash([3,3]);
    ctx.strokeStyle = 'rgba(248,81,73,.35)'; ctx.lineWidth = 1;
    const gyShow = 68 - (MOTION_GATE_SHOW / maxOmega) * 58;
    ctx.beginPath(); ctx.moveTo(0, gyShow); ctx.lineTo(W, gyShow); ctx.stroke();
    ctx.strokeStyle = 'rgba(248,81,73,.7)'; ctx.lineWidth = 1;
    const gyHide = 68 - (MOTION_GATE_HIDE / maxOmega) * 58;
    ctx.beginPath(); ctx.moveTo(0, gyHide); ctx.lineTo(W, gyHide); ctx.stroke();
    ctx.setLineDash([]);

    // Capture markers
    for (let i = 0; i < captures.length; i++) {
      const x = tX(captures[i].t);
      ctx.strokeStyle = '#f0883e'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x, 4); ctx.lineTo(x, 68); ctx.stroke();
      ctx.fillStyle = '#f0883e'; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center';
      ctx.fillText('C' + (i+1), x, 4);
    }
  });

  return panel;
}

// ─── Section card ─────────────────────────────────────────────────────────────
function sectionCard(s, captures, duration) {
  const { i, startT, endT, sensor, shift, vis, captureAtEnd } = s;

  const durS = ((endT - startT) / 1000).toFixed(1);
  const last = shift.at(-1)?.payload;
  const yawRad = last?.yawIntegral ?? 0;
  const yawDeg = (yawRad * 180 / Math.PI).toFixed(1);
  const maxOmega = sensor.reduce((m, e) => Math.max(m, e.payload.omegaMag), 0);
  const overlapPct = last ? Math.max(0, (1 - Math.abs(yawRad) / (HFOV_DEG * Math.PI / 180)) * 100).toFixed(0) : null;
  const nGateHits = vis.filter(e => !e.payload.visible).length;

  // Detect big shift jumps (ghost teleport after motion gate)
  const jumps = [];
  for (let j = 1; j < shift.length; j++) {
    const delta = Math.abs(shift[j].payload.shiftPx - shift[j-1].payload.shiftPx);
    if (delta > 50) jumps.push(delta.toFixed(0));
  }

  // Detect accumulated yaw during hidden periods (ghost teleport source)
  const accumDuringHidden = [];
  let hiddenStart = null, hiddenYaw = null;
  for (const ev of vis) {
    if (!ev.payload.visible) { hiddenStart = ev.t; hiddenYaw = ev.payload.yawIntegral; }
    else if (hiddenStart !== null) {
      const delta = Math.abs(ev.payload.yawIntegral - hiddenYaw);
      if (delta > 0.1) accumDuringHidden.push((delta * 180 / Math.PI).toFixed(1));
      hiddenStart = null;
    }
  }

  const issues = [
    nGateHits >= 3 && `ghost hidden ${nGateHits}× (fast motion)`,
    jumps.length && `shift jump ${jumps.map(j => j + 'px').join(', ')} (yaw accumulated while hidden)`,
    overlapPct !== null && parseInt(overlapPct) < 20 && `only ${overlapPct}% overlap`,
    overlapPct !== null && parseInt(overlapPct) === 0 && 'no overlap — gap in scan',
    accumDuringHidden.length && `yaw drifted ${accumDuringHidden.join(', ')}° while gate was closed`,
  ].filter(Boolean);

  const title = i === 0 ? 'Before first capture' : `Photo ${i} → Photo ${i+1}`;
  const pills = [
    `<span class="pill">${durS}s</span>`,
    last ? `<span class="pill ${parseInt(overlapPct)>=20?'green':'red'}">overlap ${overlapPct}%</span>` : '',
    last ? `<span class="pill">pan ${yawDeg}°</span>` : '',
    maxOmega > 0 ? `<span class="pill ${maxOmega>0.5?'orange':''}">peak ω ${maxOmega.toFixed(2)}</span>` : '',
    ...issues.map(iss => `<span class="issue">⚠ ${iss}</span>`),
  ].filter(Boolean).join('');

  const panel = makePanel(title, []);
  panel.querySelector('.panel-hdr').innerHTML = `<h2>${title}</h2>${pills}`;

  const body = panel.querySelector('.panel-body');
  body.style.padding = '0';

  if (sensor.length === 0 && shift.length === 0) {
    body.innerHTML = `<div class="no-data">No sensor data in this interval.</div>`;
    return panel;
  }

  // Charts row
  const grid = document.createElement('div');
  grid.className = 'charts-grid';

  // Gyro chart
  const gyroCol = document.createElement('div');
  gyroCol.className = 'chart-col';
  gyroCol.innerHTML = `<div class="chart-label">Gyro scan axis (gy, blue) · |ω| (gray) · gate 0.5 rad/s (red dashed)</div>`;
  const gyroCv = makeCanvas(110);
  gyroCol.appendChild(gyroCv);
  const gyroLegend = document.createElement('div');
  gyroLegend.className = 'legend';
  gyroLegend.innerHTML = [
    legend_('gy yaw axis (rad/s)', '#58a6ff'),
    legend_('gx pitch axis (rad/s)', '#3fb950'),
    legend_('|ω| magnitude', '#7d8590'),
    legend_(`gate show/hide (${MOTION_GATE_SHOW}/${MOTION_GATE_HIDE})`, '#f85149'),
  ].join('');
  gyroCol.appendChild(gyroLegend);
  grid.appendChild(gyroCol);

  // Shift chart
  const shiftCol = document.createElement('div');
  shiftCol.className = 'chart-col';
  shiftCol.innerHTML = `<div class="chart-label">Ghost shift px · X=yaw · Y=pitch · red zone = ghost hidden</div>`;
  const shiftCv = makeCanvas(110);
  shiftCol.appendChild(shiftCv);
  const shiftLegend = document.createElement('div');
  shiftLegend.className = 'legend';
  shiftLegend.innerHTML = [
    legend_('shiftPx (yaw)', '#e6edf3'),
    legend_('shiftPy (pitch)', '#3fb950'),
    legend_('ghost hidden', 'rgba(248,81,73,.3)'),
    legend_('±displayWidth/2', '#30363d'),
  ].join('');
  shiftCol.appendChild(shiftLegend);
  grid.appendChild(shiftCol);

  body.appendChild(grid);

  // Ghost at capture row
  const ghostAtCapture = captureAtEnd?.payload?.ghost ?? null;
  if (ghostAtCapture !== null) {
    const gcDiv = document.createElement('div');
    gcDiv.style.cssText = 'padding:10px 14px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:8px;align-items:center';
    const visLabel = ghostAtCapture.visible
      ? `<span class="pill green">visible</span>`
      : `<span class="pill red">hidden (moving)</span>`;
    const pxLabel = (v, name) => `<span class="pill" title="${name}">${name} ${v >= 0 ? '+' : ''}${v.toFixed(1)}px</span>`;
    const radLabel = (v, name) => `<span class="pill" title="${name}">${name} ${(v * 180 / Math.PI).toFixed(1)}°</span>`;
    gcDiv.innerHTML =
      `<span style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-right:4px">Ghost at shutter</span>` +
      visLabel +
      pxLabel(ghostAtCapture.shiftPx, 'X') +
      pxLabel(ghostAtCapture.shiftPy, 'Y') +
      radLabel(ghostAtCapture.yawIntegral, 'yaw') +
      radLabel(ghostAtCapture.pitchIntegral, 'pitch');
    body.appendChild(gcDiv);
  }

  // AR diagram
  if (last) {
    const arDiv = document.createElement('div');
    arDiv.style.cssText = 'padding:12px 14px;border-top:1px solid var(--border)';
    arDiv.innerHTML = `<div class="chart-label">AR overlap diagram — angular space, end of section</div>`;
    const arCv = makeCanvas(90);
    arDiv.appendChild(arCv);
    const arLegend = document.createElement('div');
    arLegend.className = 'legend';
    arLegend.style.marginTop = '8px';
    arLegend.innerHTML = [
      legend_('Previous photo FOV', 'rgba(240,136,62,.5)'),
      legend_('Current camera FOV', 'rgba(88,166,255,.5)'),
      legend_('Overlap', 'rgba(63,185,80,.5)'),
    ].join('') + `<span style="margin-left:auto;font-size:11px;color:var(--muted)">` +
      `Δyaw=${yawDeg}° · FOV=${HFOV_DEG}° · display=${last.displayWidth}px</span>`;
    arDiv.appendChild(arLegend);
    body.appendChild(arDiv);

    queueDraw(() => {
      arCv.width = arCv.parentElement.clientWidth - 28;
      arCv.height = 90;
      drawAR(arCv, yawRad, last.displayWidth);
    });
  }

  queueDraw(() => {
    const colW = gyroCv.parentElement.clientWidth - 28;
    gyroCv.width = colW; gyroCv.height = 110;
    drawGyro(gyroCv, sensor, vis, startT, endT);

    shiftCv.width = colW; shiftCv.height = 110;
    drawShift(shiftCv, shift, vis, startT, endT);
  });

  return panel;
}

// ─── Chart: Gyro ─────────────────────────────────────────────────────────────
function drawGyro(cv, sensor, vis, startT, endT) {
  if (!sensor.length) return;
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const tX = t => ((t - startT) / (endT - startT)) * W;

  ctx.fillStyle = '#0d1117'; ctx.fillRect(0, 0, W, H);

  const gyRange = 0.6;
  const gyY = v => H/2 - clamp(v / gyRange, -1, 1) * (H/2 - 8);
  const omY  = v => H - 5 - clamp(v / gyRange, 0, 1) * (H - 13);

  // Zero line
  ctx.strokeStyle = '#21262d'; ctx.lineWidth = 1;
  hline(ctx, H/2, W);

  // Gate thresholds (show + hide hysteresis)
  ctx.setLineDash([3,3]);
  ctx.strokeStyle = 'rgba(248,81,73,.35)'; ctx.lineWidth = 1;
  hline(ctx, omY(MOTION_GATE_SHOW), W);
  ctx.strokeStyle = 'rgba(248,81,73,.7)'; ctx.lineWidth = 1;
  hline(ctx, omY(MOTION_GATE_HIDE), W);
  ctx.setLineDash([]);

  // |ω| area
  ctx.strokeStyle = 'rgba(125,133,144,.55)'; ctx.lineWidth = 1;
  polyline(ctx, sensor, e => tX(e.t), e => omY(e.payload.omegaMag));

  // gx (pitch)
  ctx.strokeStyle = 'rgba(63,185,80,.8)'; ctx.lineWidth = 1.5;
  polyline(ctx, sensor, e => tX(e.t), e => gyY(e.payload.gx ?? 0));

  // gy (yaw)
  ctx.strokeStyle = '#58a6ff'; ctx.lineWidth = 1.5;
  polyline(ctx, sensor, e => tX(e.t), e => gyY(e.payload.gy));

  // Axis labels
  ctx.fillStyle = '#7d8590'; ctx.font = '9px monospace'; ctx.textAlign = 'left';
  ctx.fillText(`+${gyRange}`, 2, 12);
  ctx.fillText('  0', 2, H/2 + 4);
  ctx.fillText(`-${gyRange}`, 2, H - 4);
}

// ─── Chart: Shift ─────────────────────────────────────────────────────────────
function drawShift(cv, shift, vis, startT, endT) {
  if (!shift.length) return;
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const tX = t => ((t - startT) / (endT - startT)) * W;

  ctx.fillStyle = '#0d1117'; ctx.fillRect(0, 0, W, H);

  const halfPx = (shift[0].payload.displayWidth ?? 411) / 2;
  const shY = v => H/2 - clamp(v / halfPx, -1, 1) * (H/2 - 8);

  // Hidden zones
  let wasVis = true, lastT2 = startT;
  for (const ev of vis) {
    if (!wasVis) { paintBand(ctx, tX(lastT2), tX(ev.t), 'rgba(248,81,73,.15)'); }
    wasVis = ev.payload.visible; lastT2 = ev.t;
  }
  if (!wasVis) paintBand(ctx, tX(lastT2), W, 'rgba(248,81,73,.15)');

  // ±half lines
  ctx.strokeStyle = '#30363d'; ctx.lineWidth = 1; ctx.setLineDash([2,4]);
  hline(ctx, shY(halfPx), W); hline(ctx, shY(-halfPx), W);
  ctx.setLineDash([]);

  // Zero line
  ctx.strokeStyle = '#21262d'; ctx.lineWidth = 1;
  hline(ctx, H/2, W);

  // shiftPy (pitch) — draw first so yaw is on top
  ctx.strokeStyle = 'rgba(63,185,80,.8)'; ctx.lineWidth = 1.5;
  polyline(ctx, shift, e => tX(e.t), e => shY(e.payload.shiftPy ?? 0));

  // shiftPx (yaw)
  ctx.strokeStyle = '#e6edf3'; ctx.lineWidth = 2;
  polyline(ctx, shift, e => tX(e.t), e => shY(e.payload.shiftPx));

  // Axis labels
  ctx.fillStyle = '#7d8590'; ctx.font = '9px monospace'; ctx.textAlign = 'left';
  ctx.fillText(`+${halfPx.toFixed(0)}`, 2, 12);
  ctx.fillText('  0', 2, H/2 + 4);
  ctx.fillText(`-${halfPx.toFixed(0)}`, 2, H - 4);
}

// ─── Chart: AR overlap diagram ─────────────────────────────────────────────────
// Shows where the previous photo and current camera FOV sit in angular world space.
// yawIntegral > 0  = camera rotated right from prev capture → prev photo is LEFT
// yawIntegral < 0  = camera rotated left  from prev capture → prev photo is RIGHT
function drawAR(cv, yawIntegral, displayWidth) {
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;

  ctx.fillStyle = '#0d1117'; ctx.fillRect(0, 0, W, H);

  const yawDeg = yawIntegral * 180 / Math.PI;

  // World range shown: 3× FOV centred on 0° (prev capture centre)
  const worldDeg = 3 * HFOV_DEG;
  const dpx = W / worldDeg; // display pixels per degree

  const cx = W / 2; // angle 0 in px

  // Previous photo (centred at 0°)
  const pL = cx - (HFOV_DEG / 2) * dpx;
  const pR = cx + (HFOV_DEG / 2) * dpx;

  // Current camera centre in world-angle space = yawDeg
  // (positive yawDeg = camera moved RIGHT, centred right of prev capture centre)
  const cCx = cx + yawDeg * dpx;
  const cL = cCx - (HFOV_DEG / 2) * dpx;
  const cR = cCx + (HFOV_DEG / 2) * dpx;

  const barY = 18, barH = 40;

  // Book background
  ctx.fillStyle = '#161b22';
  ctx.fillRect(Math.min(pL, cL) - 4, barY - 2, Math.max(pR, cR) - Math.min(pL, cL) + 8, barH + 4);

  // Prev photo (orange)
  ctx.fillStyle = 'rgba(240,136,62,.25)'; ctx.fillRect(pL, barY, pR - pL, barH);
  ctx.strokeStyle = '#f0883e'; ctx.lineWidth = 1.5; ctx.strokeRect(pL, barY, pR - pL, barH);

  // Current camera (blue)
  ctx.fillStyle = 'rgba(88,166,255,.25)'; ctx.fillRect(cL, barY, cR - cL, barH);
  ctx.strokeStyle = '#58a6ff'; ctx.lineWidth = 1.5; ctx.strokeRect(cL, barY, cR - cL, barH);

  // Overlap (green)
  const oL = Math.max(pL, cL), oR = Math.min(pR, cR);
  if (oR > oL) {
    ctx.fillStyle = 'rgba(63,185,80,.4)'; ctx.fillRect(oL, barY, oR - oL, barH);
    const overlapDeg = (oR - oL) / dpx;
    const overlapPct = (overlapDeg / HFOV_DEG * 100).toFixed(0);
    ctx.fillStyle = '#3fb950'; ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center';
    ctx.fillText(`${overlapPct}% overlap`, (oL + oR) / 2, barY + barH / 2 + 4);
  } else {
    ctx.fillStyle = '#f85149'; ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center';
    ctx.fillText('NO OVERLAP', cx, barY + barH / 2 + 4);
  }

  // Labels
  ctx.fillStyle = '#f0883e'; ctx.font = '10px system-ui'; ctx.textAlign = 'center';
  ctx.fillText('Photo N-1 (0°)', cx, barY - 4);

  // Ghost direction annotation
  const ghostDir = yawDeg < 0 ? '→ right' : yawDeg > 0 ? '← left' : 'center';
  const ghostPx = yawDeg < 0
    ? `+${Math.abs(computeShift(yawIntegral, displayWidth)).toFixed(0)}px`
    : yawDeg > 0 ? `-${Math.abs(computeShift(yawIntegral, displayWidth)).toFixed(0)}px` : '0px';

  ctx.fillStyle = '#58a6ff'; ctx.font = '10px system-ui';
  ctx.fillText(`Current (${yawDeg >= 0 ? '+' : ''}${yawDeg.toFixed(1)}°)`, cCx, barY + barH + 12);

  // Ghost shift annotation
  ctx.fillStyle = '#7d8590'; ctx.font = '10px monospace'; ctx.textAlign = 'center';
  ctx.fillText(`ghost ${ghostDir} @ ${ghostPx}`, W / 2, H - 2);

  // Axis ticks
  ctx.fillStyle = '#30363d'; ctx.textAlign = 'center'; ctx.font = '9px monospace';
  for (let deg = -HFOV_DEG; deg <= HFOV_DEG; deg += HFOV_DEG / 2) {
    const x = cx + deg * dpx;
    ctx.fillStyle = '#30363d'; ctx.fillRect(x, barY + barH + 2, 1, 4);
    ctx.fillStyle = '#7d8590'; ctx.fillText(`${deg >= 0 ? '+' : ''}${deg.toFixed(0)}°`, x, H - 2);
  }
}

// ─── Re-Simulation Panel ─────────────────────────────────────────────────────
function resimPanel(motionAll, shiftAll, visAll, captures, duration) {
  const panel = makePanel('Tilt & Translation Re-Simulator', []);
  const body = panel.querySelector('.panel-body');
  body.style.padding = '0';

  // Controls
  const controls = document.createElement('div');
  controls.className = 'resim-controls';
  controls.innerHTML = `
    <div class="resim-group">
      <label>Max Tilt (°) <span class="val" id="resim-tilt-val">30</span> <small>(raw accel=30°, hw-subtracted=45°)</small></label>
      <input type="range" id="resim-tilt" min="10" max="80" step="1" value="30">
    </div>
    <div class="resim-group">
      <label>Gate Show (rad/s) <span class="val" id="resim-show-val">0.40</span></label>
      <input type="range" id="resim-show" min="0.1" max="1.5" step="0.05" value="0.40">
    </div>
    <div class="resim-group">
      <label>Gate Hide (rad/s) <span class="val" id="resim-hide-val">0.55</span></label>
      <input type="range" id="resim-hide" min="0.1" max="2.0" step="0.05" value="0.55">
    </div>
  `;
  body.appendChild(controls);

  // Charts
  const grid = document.createElement('div');
  grid.className = 'charts-grid';

  const betaCol = document.createElement('div');
  betaCol.className = 'chart-col';
  betaCol.innerHTML = `<div class="chart-label">betaDeg timeline · green band = accepted · red = ZUPT fires</div>`;
  const betaCv = makeCanvas(100);
  betaCol.appendChild(betaCv);
  const betaLegend = document.createElement('div');
  betaLegend.className = 'legend';
  betaLegend.innerHTML = [
    legend_('betaDeg', '#58a6ff'),
    legend_('Acceptance band (90±maxTilt)', 'rgba(63,185,80,.2)'),
    legend_('Capture', '#f0883e'),
  ].join('');
  betaCol.appendChild(betaLegend);
  grid.appendChild(betaCol);

  const transCol = document.createElement('div');
  transCol.className = 'chart-col';
  transCol.innerHTML = `<div class="chart-label">Translation dx_cm · actual (dim) vs simulated (bright) · resets at captures</div>`;
  const transCv = makeCanvas(100);
  transCol.appendChild(transCv);
  const transLegend = document.createElement('div');
  transLegend.className = 'legend';
  transLegend.innerHTML = [
    legend_('Actual dx_cm', 'rgba(88,166,255,.4)'),
    legend_('Simulated dx_cm', '#58a6ff'),
    legend_('Actual dy_cm', 'rgba(63,185,80,.3)'),
    legend_('Simulated dy_cm', '#3fb950'),
  ].join('');
  transCol.appendChild(transLegend);
  grid.appendChild(transCol);

  body.appendChild(grid);

  // Summary area
  const summary = document.createElement('div');
  summary.className = 'resim-summary';
  summary.id = 'resim-summary';
  body.appendChild(summary);

  function simulate(maxTiltDeg, gateShow, gateHide) {
    let velX = 0, velY = 0, dx_m = 0, dy_m = 0, lastT = -Infinity;
    let gateHidden = false, zuptCount = 0, passCount = 0;
    const segments = [];

    const captureTimes = captures.map(c => c.t);
    let capIdx = 0;

    for (const ev of motionAll) {
      while (capIdx < captureTimes.length && ev.t > captureTimes[capIdx]) {
        velX = 0; velY = 0; dx_m = 0; dy_m = 0; lastT = -Infinity;
        capIdx++;
      }

      const { ax, ay, betaDeg, interval_ms } = ev.payload;
      const omegaMag = shiftAll.find(s => Math.abs(s.t - ev.t) < 200)?.payload?.omegaMag ?? 0;

      if (gateHidden) {
        if (omegaMag <= gateShow) { gateHidden = false; }
      } else {
        if (omegaMag > gateHide) { gateHidden = true; velX = 0; velY = 0; }
      }

      const tiltOk = Math.abs(betaDeg - 90) <= maxTiltDeg;
      if (!tiltOk) {
        velX = 0; velY = 0;
        zuptCount++;
      } else if (!gateHidden) {
        const dt = lastT === -Infinity
          ? Math.min(interval_ms / 1000, 0.1)
          : Math.min((ev.t - lastT) / 1000, 0.5);
        const nVelX = velX + ax * dt;
        const nVelY = velY + ay * dt;
        dx_m += (velX + nVelX) / 2 * dt;
        dy_m += (velY + nVelY) / 2 * dt;
        velX = nVelX;
        velY = nVelY;
        passCount++;
      }
      lastT = ev.t;

      segments.push({ t: ev.t, dx_cm: dx_m * 100, dy_cm: dy_m * 100, betaDeg, zupt: !tiltOk, gateVis: !gateHidden });
    }

    return { segments, zuptCount, passCount, finalDx: dx_m * 100, finalDy: dy_m * 100 };
  }

  function drawResim() {
    const maxTiltDeg = +document.getElementById('resim-tilt').value;
    const gateShow = +document.getElementById('resim-show').value;
    const gateHide = +document.getElementById('resim-hide').value;

    document.getElementById('resim-tilt-val').textContent = maxTiltDeg;
    document.getElementById('resim-show-val').textContent = gateShow.toFixed(2);
    document.getElementById('resim-hide-val').textContent = gateHide.toFixed(2);

    const result = simulate(maxTiltDeg, gateShow, gateHide);
    const { segments, zuptCount, passCount, finalDx, finalDy } = result;

    const actualFinalDx = motionAll.at(-1)?.payload?.dx_cm ?? 0;
    const actualFinalDy = motionAll.at(-1)?.payload?.dy_cm ?? 0;

    const simGood = Math.abs(finalDx) > 1;
    summary.innerHTML = [
      `<div class="metric ${Math.abs(actualFinalDx) < 0.5 ? 'bad' : ''}"><span>Actual dx</span><b>${actualFinalDx.toFixed(2)} cm</b></div>`,
      `<div class="metric ${simGood ? 'good' : 'bad'}"><span>Simulated dx</span><b>${finalDx.toFixed(2)} cm</b></div>`,
      `<div class="metric"><span>Actual dy</span><b>${actualFinalDy.toFixed(2)} cm</b></div>`,
      `<div class="metric"><span>Simulated dy</span><b>${finalDy.toFixed(2)} cm</b></div>`,
      `<div class="metric ${zuptCount > passCount ? 'bad' : ''}"><span>ZUPT fires</span><b>${zuptCount}/${motionAll.length}</b></div>`,
      `<div class="metric ${passCount < 5 ? 'bad' : 'good'}"><span>Samples passed</span><b>${passCount}/${motionAll.length}</b></div>`,
    ].join('');

    // betaDeg chart
    const bW = betaCv.parentElement.clientWidth - 28;
    betaCv.width = bW; betaCv.height = 100;
    const bCtx = betaCv.getContext('2d');
    const t0 = motionAll[0].t, tEnd = motionAll.at(-1).t;
    const bX = t => ((t - t0) / (tEnd - t0)) * bW;
    const bY = deg => 96 - (deg / 180) * 88;

    bCtx.fillStyle = '#0d1117'; bCtx.fillRect(0, 0, bW, 100);

    // Acceptance band
    const bandTop = bY(90 + maxTiltDeg);
    const bandBot = bY(90 - maxTiltDeg);
    bCtx.fillStyle = 'rgba(63,185,80,.12)';
    bCtx.fillRect(0, bandTop, bW, bandBot - bandTop);

    // 90° reference
    bCtx.strokeStyle = '#30363d'; bCtx.lineWidth = 1;
    hline(bCtx, bY(90), bW);
    bCtx.setLineDash([3, 3]);
    bCtx.strokeStyle = 'rgba(63,185,80,.5)'; bCtx.lineWidth = 1;
    hline(bCtx, bandTop, bW); hline(bCtx, bandBot, bW);
    bCtx.setLineDash([]);

    // ZUPT markers
    bCtx.fillStyle = 'rgba(248,81,73,.4)';
    for (const s of segments) {
      if (s.zupt) bCtx.fillRect(bX(s.t) - 1, 0, 2, 100);
    }

    // betaDeg line
    bCtx.strokeStyle = '#58a6ff'; bCtx.lineWidth = 1.5;
    polyline(bCtx, segments, s => bX(s.t), s => bY(s.betaDeg));

    // Capture markers
    bCtx.strokeStyle = '#f0883e'; bCtx.lineWidth = 1.5;
    for (const c of captures) {
      const x = bX(c.t);
      if (x > 0 && x < bW) { bCtx.beginPath(); bCtx.moveTo(x, 4); bCtx.lineTo(x, 96); bCtx.stroke(); }
    }

    // Labels
    bCtx.fillStyle = '#7d8590'; bCtx.font = '9px monospace'; bCtx.textAlign = 'left';
    bCtx.fillText('180°', 2, 10); bCtx.fillText('90°', 2, bY(90) + 3); bCtx.fillText('0°', 2, 96);

    // Translation chart
    const tW = transCv.parentElement.clientWidth - 28;
    transCv.width = tW; transCv.height = 100;
    const tCtx = transCv.getContext('2d');
    const tX2 = t => ((t - t0) / (tEnd - t0)) * tW;

    tCtx.fillStyle = '#0d1117'; tCtx.fillRect(0, 0, tW, 100);

    const maxDisp = Math.max(
      1,
      ...segments.map(s => Math.abs(s.dx_cm)),
      ...segments.map(s => Math.abs(s.dy_cm)),
      ...motionAll.map(e => Math.abs(e.payload.dx_cm)),
      ...motionAll.map(e => Math.abs(e.payload.dy_cm)),
    );
    const dY = v => 50 - (v / maxDisp) * 42;

    // Zero line
    tCtx.strokeStyle = '#21262d'; tCtx.lineWidth = 1;
    hline(tCtx, 50, tW);

    // Actual (dim)
    tCtx.strokeStyle = 'rgba(88,166,255,.4)'; tCtx.lineWidth = 1;
    polyline(tCtx, motionAll, e => tX2(e.t), e => dY(e.payload.dx_cm));
    tCtx.strokeStyle = 'rgba(63,185,80,.3)'; tCtx.lineWidth = 1;
    polyline(tCtx, motionAll, e => tX2(e.t), e => dY(e.payload.dy_cm));

    // Simulated (bright)
    tCtx.strokeStyle = '#58a6ff'; tCtx.lineWidth = 2;
    polyline(tCtx, segments, s => tX2(s.t), s => dY(s.dx_cm));
    tCtx.strokeStyle = '#3fb950'; tCtx.lineWidth = 2;
    polyline(tCtx, segments, s => tX2(s.t), s => dY(s.dy_cm));

    // Labels
    tCtx.fillStyle = '#7d8590'; tCtx.font = '9px monospace'; tCtx.textAlign = 'left';
    tCtx.fillText(`+${maxDisp.toFixed(1)}cm`, 2, 10);
    tCtx.fillText('0', 2, 53);
    tCtx.fillText(`-${maxDisp.toFixed(1)}cm`, 2, 96);
  }

  queueDraw(() => {
    drawResim();
    document.getElementById('resim-tilt').addEventListener('input', drawResim);
    document.getElementById('resim-show').addEventListener('input', drawResim);
    document.getElementById('resim-hide').addEventListener('input', drawResim);
  });

  return panel;
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function computeShift(yawIntegral, displayWidth, hFovDeg = HFOV_DEG) {
  const r = (hFovDeg * Math.PI) / 180;
  const s = -(displayWidth / 2) / Math.tan(r / 2) * yawIntegral;
  return Math.max(-displayWidth / 2, Math.min(displayWidth / 2, s));
}

function polyline(ctx, pts, xFn, yFn) {
  if (!pts.length) return;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const x = xFn(pts[i]), y = yFn(pts[i]);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
}

function hline(ctx, y, W) {
  ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
}

function paintBand(ctx, x1, x2, color) {
  if (!color || x2 <= x1) return;
  ctx.fillStyle = color; ctx.fillRect(x1, 0, x2 - x1, ctx.canvas.height);
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function makeCanvas(h) {
  const cv = document.createElement('canvas');
  cv.height = h;
  return cv;
}

function makePanel(title, _pills) {
  const el = document.createElement('div');
  el.className = 'panel';
  el.innerHTML = `<div class="panel-hdr"><h2>${title}</h2></div><div class="panel-body"></div>`;
  return el;
}

function legend_(label, color) {
  return `<div class="legend-item"><div class="swatch" style="background:${color}"></div>${label}</div>`;
}
